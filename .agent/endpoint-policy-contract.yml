version: 1
name: endpoint-transport-policy
repo: diazMelgarejo/orama-system
role: peer-consumer
canonical_repo: diazMelgarejo/Perpetua-Tools
canonical_module: src/utils/endpoint_policy_core.py
canonical_contract: .agent/endpoint-policy-contract.yml

invariants:
  - id: transport-identity
    rule: Transport identity is scheme + hostname + backend-specific port.
  - id: preserve-scheme
    rule: Endpoint reconstruction must preserve http/https from discovery output.
  - id: no-double-scheme
    rule: Runtime sources must not construct http://http or https://https endpoints.
  - id: controlled-reconstruction-boundary
    rule: Generated or proxied model endpoints must follow Perpetua endpoint_policy_core semantics.
  - id: backend-port-isolation
    rule: Ollama and LM Studio ports must not contaminate each other under active_tilting.

peer_repos:
  - repo: diazMelgarejo/Perpetua-Tools
    status: canonical-provider
    expected_contract: endpoint-transport-policy
    rule: Owns src/utils/endpoint_policy_core.py and local CI enforcement.
  - repo: diazMelgarejo/orama-system
    status: peer-consumer
    expected_contract: endpoint-transport-policy
    rule: Must preserve the same transport identity semantics in generated configs, proxy endpoints, skills, and orchestration guidance.

existing_skill_references:
  - path: bin/orama-system/skills/oramasys-method/SKILL.md
    reason: Use for architecture-heavy endpoint policy changes and integrative PR work.
  - path: bin/orama-system/skills/oramasys-method/references/integrative-merge.md
    reason: Use when syncing endpoint policy changes across branches or repos.
  - path: bin/orama-system/skills/git-history-surgery/SKILL.md
    reason: Use before judging branch state across rewritten histories.
  - path: docs/SECURITY-POLICY.md
    reason: Redirect to canonical SECURITY.md for security PR stacking rules.
  - path: AGENTS.md
    reason: Cross-agent endpoint transport policy instructions.

required_local_files:
  - .agent/endpoint-policy-contract.yml
  - scripts/security/check_endpoint_policy_contract.py
  - .github/workflows/endpoint-policy-contract.yml
  - AGENTS.md

workflow_requirements:
  - workflow: .github/workflows/endpoint-policy-contract.yml
    must_run:
      - python scripts/security/check_endpoint_policy_contract.py
