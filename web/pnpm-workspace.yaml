# pnpm configuration for this single-package project.
# 'packages' is intentionally omitted — this is not a monorepo workspace.
# Settings here follow the pnpm v9.7+ format (pnpm field in package.json is ignored).
onlyBuiltDependencies:
  - esbuild
overrides:
  esbuild: "0.28.1"
  # GHSA-eating brace-expansion DoS (dependabot #8): scoped to the
  # minimatch@10 edge only (typescript-eslint's chain) so the unrelated
  # minimatch@3.1.5 -> brace-expansion@1.x edge (different major API) is
  # never touched.
  minimatch@10>brace-expansion: "^5.0.7"
  # Same advisory family, the other edge (dependabot #9): minimatch@3.1.5
  # (older eslint-adjacent chain) declares brace-expansion@^1.1.7 --
  # 1.1.16 is a same-major patch release, safe within that range.
  minimatch@3>brace-expansion: "^1.1.16"
  # js-yaml DoS (dependabot #26, GHSA-5p4m-2wfm-xmqj): pulled in transitively
  # via @eslint/eslintrc -> eslint (dev-only). 4.3.1 is the latest 4.x patch
  # release and the GHSA-recommended floor (was pinned to ^4.3.0, the
  # vulnerable version itself, which only pinned the major -- ^4.3.0 permits
  # 4.3.0 and does not exclude it).
  js-yaml: "^4.3.1"
