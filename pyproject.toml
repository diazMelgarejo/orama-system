[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "orama-system"
version = "1.1.0.0"
description = "Orama multi-agent reasoning and orchestration system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.9,<0.2",
    "starlette>=1.3.1",
    "uvicorn>=0.27.0",
]

[project.scripts]
oramaclaw = "oramaclaw.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "hatchling>=1.26.0",
    "build>=1.2.0",
    "tomli>=2.0.1; python_version < \"3.11\"",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", ".", "scripts"]
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.uv]
managed = true

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "bin",
    "examples",
    "docs",
    "scripts",
    "tests",
    "LICENSE",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "install.sh",
]

[tool.hatch.build.targets.wheel]
packages = ["bin", "src/orama_system", "src/oramaclaw", "src/utils"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "docs"
"examples" = "examples"
"scripts" = "scripts"
"LICENSE" = "LICENSE"
"README.md" = "README.md"
"CONTRIBUTING.md" = "CONTRIBUTING.md"
"CHANGELOG.md" = "CHANGELOG.md"
"install.sh" = "install.sh"
