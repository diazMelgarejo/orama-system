# post-merge-review-sweep.yml
# After any PR merges to main, fetch all unresolved CodeRabbit/Cursor review
# threads and post a summary comment on the PR. No more manual API polling.
name: Post-merge review sweep

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  sweep:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Fetch unresolved review threads
        id: threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, sys

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          pr    = os.environ["PR_NUMBER"]

          def gh(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          # Pull all inline review comments
          comments = gh(f"https://api.github.com/repos/{repo}/pulls/{pr}/comments?per_page=100")
          # Pull all issue-level review bodies (CodeRabbit summary comments)
          reviews  = gh(f"https://api.github.com/repos/{repo}/pulls/{pr}/reviews?per_page=100")

          bots = {"coderabbitai[bot]", "cursor[bot]", "github-actions[bot]"}
          bot_comments = [c for c in comments if c["user"]["login"] in bots]

          if not bot_comments:
              print("NO_UNRESOLVED=true")
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write("unresolved_count=0\n")
                  f.write("summary=All review comments resolved.\n")
              sys.exit(0)

          lines = [f"## Post-merge review sweep — PR #{pr}\n",
                   f"{len(bot_comments)} unresolved bot comment(s) need attention:\n"]
          for c in bot_comments[:20]:
              path = c.get("path","?")
              line = c.get("line") or c.get("original_line","?")
              body = c["body"][:200].replace("\n", " ")
              lines.append(f"- **{c['user']['login']}** `{path}:{line}` — {body}")
          if len(bot_comments) > 20:
              lines.append(f"- _(+{len(bot_comments)-20} more — see PR review tab)_")
          lines.append("\n> Fix directly to main: `git checkout main && <edits> && git commit && git push`")

          summary = "\n".join(lines)
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"unresolved_count={len(bot_comments)}\n")
              # multiline output
              delim = "EOF_SUMMARY"
              f.write(f"summary<<{delim}\n{summary}\n{delim}\n")
          PYEOF

      - name: Comment summary on PR
        if: steps.threads.outputs.unresolved_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.threads.outputs.summary }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: summary,
            });
            core.notice(`Posted sweep summary: ${${{ steps.threads.outputs.unresolved_count }}} unresolved comment(s)`);
