# post-merge-review-sweep.yml
# After any PR merges to main, fetch all unresolved CodeRabbit/Cursor review
# threads and post a summary comment on the PR. No more manual API polling.
#
# Uses pull_request_target (not pull_request): this workflow never checks
# out or executes PR code -- it only calls the GitHub API via GH_TOKEN/
# github-script -- so there's no code-execution risk from switching event
# types. pull_request runs with a read-only GITHUB_TOKEN for PRs from
# certain branches/apps regardless of the `permissions:` block below,
# which is exactly what caused "Resource not accessible by integration"
# on the "Comment summary on PR" step (2026-07-30). pull_request_target
# always runs with the base repo's token permissions.
name: Post-merge review sweep

on:
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  sweep:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Fetch unresolved review threads
        id: threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo  = os.environ["REPO"]
          pr    = os.environ["PR_NUMBER"]
          owner, name = repo.split("/", 1)

          def graphql(query, variables):
              body = json.dumps({"query": query, "variables": variables}).encode()
              req = urllib.request.Request("https://api.github.com/graphql", data=body, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              })
              with urllib.request.urlopen(req) as r:
                  response = json.loads(r.read())
              if response.get("errors"):
                  raise RuntimeError(response["errors"])
              return response["data"]

          query = """
          query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                reviewThreads(first: 100, after: $cursor) {
                  nodes {
                    isResolved
                    path
                    line
                    originalLine
                    comments(first: 100) {
                      nodes { author { login } body url }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          """

          bots = {"coderabbitai[bot]", "cursor[bot]", "github-actions[bot]"}
          bot_threads = []
          cursor = None
          while True:
              data = graphql(query, {
                  "owner": owner,
                  "name": name,
                  "number": int(pr),
                  "cursor": cursor,
              })
              threads = data["repository"]["pullRequest"]["reviewThreads"]
              for thread in threads["nodes"]:
                  if thread["isResolved"]:
                      continue
                  comments = thread["comments"]["nodes"]
                  bot_comment = next(
                      (comment for comment in reversed(comments)
                       if (comment.get("author") or {}).get("login") in bots),
                      None,
                  )
                  if bot_comment is not None:
                      bot_threads.append((thread, bot_comment))
              page = threads["pageInfo"]
              if not page["hasNextPage"]:
                  break
              cursor = page["endCursor"]

          lines = [f"## Post-merge review sweep — PR #{pr}\n"]
          if not bot_threads:
              lines.append("All bot review threads are resolved.")
          else:
              lines.append(f"{len(bot_threads)} unresolved bot review thread(s) need attention:\n")
              for thread, comment in bot_threads[:20]:
                  path = thread.get("path", "?")
                  line = thread.get("line") or thread.get("originalLine") or "?"
                  body = comment["body"][:200].replace("\n", " ")
                  author = (comment.get("author") or {}).get("login", "unknown")
                  lines.append(f"- **{author}** `{path}:{line}` — {body} ({comment['url']})")
              if len(bot_threads) > 20:
                  lines.append(f"- _(+{len(bot_threads)-20} more — see PR review tab)_")
              lines.append("\n> Use a reviewed follow-up branch for any still-valid finding.")

          summary = "\n".join(lines)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(summary + "\n")
          with open("sweep-summary.md", "w", encoding="utf-8") as f:
              f.write(summary + "\n")
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"unresolved_count={len(bot_threads)}\n")
          PYEOF

      - name: Comment summary on PR
        if: steps.threads.outputs.unresolved_count != '0' && steps.threads.outputs.unresolved_count != ''
        id: comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const summary = fs.readFileSync("sweep-summary.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: summary,
            });
            core.notice("Posted unresolved review-thread summary.");

      - name: Record unavailable PR summary comment
        if: steps.comment.outcome == 'failure'
        run: |
          echo "PR summary comment could not be posted with this repository's Actions token." >> "$GITHUB_STEP_SUMMARY"
          echo "The review-thread summary remains available above in this workflow run."
