name: Test Suite
on:
  push:    { branches: [main, develop] }
  pull_request: { branches: [main] }

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PERPETUATOOLSROOT: ${{ github.workspace }}/.ci/pt-dispatch
    steps:
      - uses: actions/checkout@v5
      - name: Resolve PT dispatch test producer
        id: pt-dispatch
        run: |
          ref=$(<.github/pt-dispatch-test-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid PT dispatch test SHA" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout PT dispatch test producer
        uses: actions/checkout@v5
        with:
          repository: diazMelgarejo/Perpetua-Tools
          ref: ${{ steps.pt-dispatch.outputs.ref }}
          path: .ci/pt-dispatch
          persist-credentials: false
      - name: Verify PT dispatch guard exists
        run: test -f "$PERPETUATOOLSROOT/orchestrator/dispatch_guard.py"
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install hatchling
          python -m pip install -e ".[test]"
      - name: Verify PT runtime imports and policy
        run: |
          PYTHONPATH="$PERPETUATOOLSROOT:$PERPETUATOOLSROOT/src" python -c 'from orchestrator.dispatch_guard import DispatchGuard, DispatchRequest; DispatchGuard("unused")._authorize(DispatchRequest("ci", "echo", "echo", "check", "check"))'
      - name: Run pytest
        run: pytest tests/ -v --tb=short
      - name: Verify isolated compatibility evidence
        run: python -m pytest docs/v2/references/loop-graph-compatibility-2026-10-09/evidence/test_evidence_scripts.py -q
      - run: bash scripts/verify-package.sh
