name: Test Suite
on:
  push:    { branches: [main, develop] }
  pull_request: { branches: [main] }

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PERPETUATOOLSROOT: ${{ github.workspace }}/.ci/pt-dispatch
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve PT dispatch test producer
        id: pt-dispatch
        run: |
          ref=$(<.github/pt-dispatch-test-ref)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid PT dispatch test SHA" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout PT dispatch test producer
        uses: actions/checkout@v5
        with:
          repository: diazMelgarejo/Perpetua-Tools
          ref: ${{ steps.pt-dispatch.outputs.ref }}
          path: .ci/pt-dispatch
          persist-credentials: false
      - name: Verify PT dispatch guard exists
        run: test -f "$PERPETUATOOLSROOT/orchestrator/dispatch_guard.py"
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install hatchling
          python -m pip install -e ".[test]" aiosqlite
      - name: Verify PT guarded dispatch with a mocked effect
        run: |
          PT_STATE_DIR="$(mktemp -d)" python -c 'import asyncio; from unittest.mock import AsyncMock, patch; from scripts import spawn_agents; effect = AsyncMock(return_value={"ok": True});
          with patch.object(spawn_agents, "_dispatch_unchecked", effect):
              assert asyncio.run(spawn_agents.dispatch("ci", "smoke test", scope="ci")) == {"ok": True}
              assert effect.await_count == 1'
      - name: Run pytest
        run: python scripts/ci/run_with_subreaper.py pytest tests/ -v --tb=short
      - name: Verify isolated compatibility evidence
        run: python -m pytest docs/v2/references/loop-graph-compatibility-2026-10-09/evidence/test_evidence_scripts.py -q
      - run: bash scripts/verify-package.sh
