name: Sites MCP adapter
on:
  pull_request:
    paths: ['integrations/sites-mcp/**', '.github/workflows/sites-mcp.yml']
  push:
    branches: [main]
    paths: ['integrations/sites-mcp/**', '.github/workflows/sites-mcp.yml']
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test integrations/sites-mcp/tests/*.test.mjs
