name: CI - Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  git-hygiene:
    name: Git hygiene (mandatory hooks + attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure approved git identity
        run: |
          git config user.name "cyre"
          git config user.email "Lawrence@cyre.me"

      - name: Install mandatory repo hooks
        run: bash scripts/git/install-local-hooks.sh

      - name: Bootstrap private attribution patterns (self-contained)
        run: bash scripts/cursor/ci-bootstrap-private-attribution.sh

      - name: Sync gitignored .cursor/private
        run: |
          bash scripts/cursor/write-openclaw-private-attribution.sh || true
          bash scripts/cursor/sync-private-attribution-from-home.sh

      - name: Scan tracked files for banned tokens
        run: bash scripts/git/scan-tracked-banned-tokens.sh

      - name: Verify git guards
        run: bash scripts/git/verify-git-guards.sh

      - name: Guard-parity completeness (zero fragmentation, docs/v2/27)
        run: bash scripts/git/verify-guard-parity.sh

      - name: Repo hygiene gate
        run: python3 scripts/review/repo_hygiene.py .

      - name: Audit branch commit attribution (PR commits)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}" || true
          RANGE="origin/${{ github.base_ref }}..HEAD"
          GIT_AUDIT_RANGE="$RANGE" GIT_AUDIT_STRICT=1 bash scripts/git/audit_attribution.sh

  test:
    needs: [git-hygiene]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[test]" build
      
      - name: Run pytest
        run: |
          pytest -q tests/
      
      - name: Run package install test
        run: |
          python scripts/test-package-install.py
      
      - name: Build package
        run: |
          python -m build

  lint:
    needs: [git-hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
      
      - name: Lint with flake8 (warnings only)
        run: |
          # stop the build on syntax errors or undefined names, but ignore style warnings
          flake8 bin tests --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Check imports
        run: |
          pip install -q ".[test]"
          python -c "from bin.shared.oramasys_core import Stage, TaskState; print('✓ oramasys_core imports OK')"
          python -c "import bin, pathlib, sys; sys.path.insert(0, str(pathlib.Path(bin.__file__).parent / 'orama-system')); from cidf.core.content_insertion_framework import decide; print('✓ CIDF imports OK')"

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel hatchling build
          python -m pip install .
      
      - name: Build sdist and wheel
        run: |
          python -m build
      
      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  docs-sync:
    name: SKILL.md Version Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify SKILL.md frontmatter version is not 1.x (no premature major bump)
        run: |
          VERSION=$(grep '^version:' bin/orama-system/SKILL.md | head -1 | awk '{print $2}')
          echo "SKILL.md version: $VERSION"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" -gt 1 ]; then
            echo "FAIL: SKILL.md version '$VERSION' is > 1.0 — major version bump >= 2.0 requires explicit approval"
            exit 1
          fi
          echo "OK: version $VERSION is allowed"

      - name: Verify Quick Start section exists
        run: |
          if ! grep -q "Quick Start" bin/orama-system/SKILL.md; then
            echo "FAIL: Quick Start section missing from bin/orama-system/SKILL.md"
            exit 1
          fi
          echo "OK: Quick Start section present"

      - name: Verify mcp-oramasys in allowed-tools
        run: |
          if ! grep -q "mcp-oramasys" bin/orama-system/SKILL.md; then
            echo "FAIL: mcp-oramasys missing from allowed-tools in SKILL.md"
            exit 1
          fi
          echo "OK: mcp-oramasys present in allowed-tools"
