title: "Orama scripts/git Is Canonical — Never Duplicate Lists"
action: >-
  Edit guard scripts only in orama-system scripts/git/. Downstream repos
  receive byte-identical copies via sync-attribution-guard-scripts.sh.
  guard-sync-manifest.sh is the single source for sync and parity file
  lists — never duplicate GUARD_SYNC_* arrays in PT or AlphaClaw.
  After canonical edits, run verify-guard-parity.sh against downstream
  checkouts before declaring parity.
evidence: >-
  PR #251: PT had fixes that never propagated back to orama, inverting
  sync direction. audit_engine.py was installed at wrong mode in canonical
  loop until manifest split executables vs data files.

