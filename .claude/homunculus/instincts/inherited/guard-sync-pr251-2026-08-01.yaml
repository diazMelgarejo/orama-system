title: "PR Body Append-Only — Never Delta update_pr"
action: >-
  Before ManagePullRequest update_pr or gh pr edit: READ body, BACKUP to
  .git/pr-body-backups/, MERGE original ## Summary with chronological
  ## Follow-up sections, WRITE full merged body via
  scripts/cursor/append-pr-body.sh. Never pass body= with only the latest
  remediation paragraph. After commit on a branch with an open PR, run
  scripts/git/remind-pr-body-append-only.sh before publish-clean-branch.
evidence: >-
  Documented clobbers: PT#154, orama#222, PT#298, orama#239, PT#314.
  PT #314 2026-08-01: agent erased guard-sync Summary with delta-only
  update_pr despite existing lessons and append-pr-body.sh.
