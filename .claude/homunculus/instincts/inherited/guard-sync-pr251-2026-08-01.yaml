id: orama-reanchor-tree-twin-no-merge-base
trigger: "when classifying branch state after a history rewrite or running reanchor_scan"
confidence: 0.93
domain: git
source: session-curation
imported_from: "PR #251 reanchor_scan hardening"
source_repo: https://github.com/diazMelgarejo/orama-system
related_lessons:
  - lesson_154b34159790
title: "Reanchor Uses Tree-Twin Only — Never merge-base"
action: >-
  Use scripts/git/reanchor_scan.sh tree-twin (%T) classification only.
  Do not use git merge-base, ahead/behind, or rev-list counts across
  rewrite boundaries. When fetch fails, abort the scan (exit nonzero) —
  do not classify refs from stale MAINREF. NO-TWIN means investigate
  with git cherry -v, not "likely fine" from merge-base.
evidence: >-
  PR #251 review 4833493387: removed merge-base ORPHAN/likely-fine
  heuristic; fail-closed on git fetch timeout/offline.

