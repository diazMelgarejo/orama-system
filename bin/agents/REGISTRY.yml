# bin/agents staging registry — OpenClaw + Hermes profile mapping
# Snapshot: 2026-07-26 (live fleet MERGE-10-edited03, 17 OpenClaw agents)
# Live machine map (do not edit for staging truth): workspace docs/oramasys/REGISTRY.yml
# Runtime JSON: bin/orama-system/config/agent_registry.json

version: staging-2026-07-26
network_name: oramasys-agent-network
live_openclaw_hub: ${HOME}/.alphaclaw/.openclaw/workspace/docs/oramasys/REGISTRY.yml
orama_agent_registry_json: bin/orama-system/config/agent_registry.json

staging_contract:
  soul_distillate: bin/agents/{staging_folder}/SOUL.md
  subagent_card: bin/agents/{staging_folder}/agent.md
  hermes_profile_root: ${HERMES_HOME}/profiles/{hermes_profile}/
  thin_skill_installer: bin/orama-system/skills/hermes-harness/scripts/install_hermes_thin_skills.py
  profile_installer: bin/orama-system/skills/hermes-harness/scripts/install_hermes_profiles.py
  win_install_hook: platform/windows/install.ps1
  win_hermes_harness_script: platform/windows/install-hermes-harness.ps1
  openclaw_overlay_sync: scripts/sync_openclaw_overlay_from_staging.sh
  persona_catalog: bin/agents/personas/
  dispatch_lane_key:
    L-H1: native Hermes delegate_task (interactive session only)
    L-PT: PT hermes_harness.py direct AIAgent scripts (NOT delegate_task)
    L-Fleet: coord_pulse / cursor-agent / git inbox coordination
  path_doctrine: bin/orama-system/skills/hermes-harness/references/openclaw-workspace-path-doctrine.md

# Pipeline + research + adapters staged for Hermes profile materialization
roles:
  - staging_folder: orchestrator
    dispatch_lane: L-Fleet
    native_hermes_delegate: false
    openclaw_id: orchestrator
    hermes_profile: orchestrator
    display: Glen
    soul_id: orama.orchestrator
    stage: router
    openclaw_workspace: ${HOME}/.openclaw/agents/orchestrator
    staged_soul: bin/agents/orchestrator/SOUL.md
    staged_agent_card: bin/agents/orchestrator/agent.md

